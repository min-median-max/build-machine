[workspace]
resolver = "2"
members = ["crates/core", "crates/controller", "crates/worker", "crates/xtask", "gui/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
build-machine-core = { path = "crates/core" }
build-machine-controller = { path = "crates/controller" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
