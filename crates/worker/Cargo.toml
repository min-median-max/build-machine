[package]
name = "build-machine-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "build-machine-worker"
path = "src/main.rs"

[dependencies]
build-machine-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile.workspace = true
